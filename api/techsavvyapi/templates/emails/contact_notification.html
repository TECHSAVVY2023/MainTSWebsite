<!DOCTYPE html>
<html>

<body style="margin:0;padding:0;background-color:#0f0620;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <!-- Outer Container -->
        <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="
              background:#120428;
              border-collapse:collapse;
              font-family:Arial,Helvetica,sans-serif;
              border-radius:10px;
              overflow:hidden;
            ">

          <!-- Header / Logo -->
          <tr>
            <td align="center" style="
                padding:12px;
                background:linear-gradient(135deg,#180b36,#120428);
                border-bottom:1px solid rgba(235,194,255,0.15);
              ">
              <img src="https://lsu-media-styles.sgp1.digitaloceanspaces.com/test/img/logo/TechSavvyLogo.png"
                alt="Tech Savvy" width="40" style="display:block;border:0;outline:none;text-decoration:none;" />
              <div style="
                  margin-top:12px;
                  font-size:14px;
                  color:#ebc2ff;
                  letter-spacing:0.5px;
                ">
                New Contact Request
              </div>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="
                padding:24px;
                font-size:14px;
                color:#e9e0ff;
                line-height:1.6;
              ">

              <!-- Details Table -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;">

                <tr>
                  <td width="150" style="padding:6px 0;font-weight:bold;color:#f6a304;">
                    Name
                  </td>
                  <td style="padding:6px 0;">{{ name }}</td>
                </tr>

                <tr>
                  <td style="padding:6px 0;font-weight:bold;color:#f6a304;">
                    Email
                  </td>
                  <td style="padding:6px 0;">
                    <a href="mailto:{{ email }}" style="color:#ebc2ff;text-decoration:none;">
                      {{ email }}
                    </a>
                  </td>
                </tr>

                <tr>
                  <td style="padding:6px 0;font-weight:bold;color:#f6a304;">
                    Business
                  </td>
                  <td style="padding:6px 0;">{{ business }}</td>
                </tr>

                <tr>
                  <td style="padding:6px 0;font-weight:bold;color:#f6a304;">
                    Interest
                  </td>
                  <td style="padding:6px 0;">{{ interest }}</td>
                </tr>

                <tr>
                  <td style="padding:6px 0;font-weight:bold;color:#f6a304;">
                    Billing
                  </td>
                  <td style="padding:6px 0;">{{ billing }}</td>
                </tr>

              </table>

              <!-- Message -->
              <div style="margin-top:20px;">
                <div style="
                    font-weight:bold;
                    color:#f6a304;
                    margin-bottom:8px;
                  ">
                  Message
                </div>

                <div style="
                    padding:14px;
                    background:#180b36;
                    border:1px solid rgba(235,194,255,0.2);
                    border-radius:6px;
                    white-space:pre-line;
                    color:#e9e0ff;
                  ">
                  {{ message }}
                </div>
              </div>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="
                padding:16px;
                font-size:12px;
                color:#cfc4f0;
                text-align:center;
                background:#0f0620;
                border-top:1px solid rgba(235,194,255,0.12);
              ">
              Tech Savvy · Automated notification<br />
              <span style="color:#9a8fc0;">
                This email was generated from the Tech Savvy contact form.
              </span>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>

</html>
